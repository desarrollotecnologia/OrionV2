{% extends "base.html" %}
{% block title %}Iniciar sesion · SoftSpoil{% endblock %}
{% block fullbody %}
<div class="min-h-screen w-full flex items-center justify-center relative overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-br from-slate-950 via-slate-900 to-orion-950"></div>
  <div class="absolute -top-32 -left-32 w-[600px] h-[600px] rounded-full bg-orion-600/20 blur-3xl"></div>
  <div class="absolute bottom-0 right-0 w-[500px] h-[500px] rounded-full bg-cyan-500/10 blur-3xl"></div>

  <div class="relative z-10 w-full max-w-md mx-4">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-orion-400 to-orion-700 grid place-items-center shadow-xl shadow-orion-700/40 mb-4">
        <span class="text-white font-extrabold text-2xl">S</span>
      </div>
      <h1 class="text-3xl font-bold text-white">SoftSpoil</h1>
      <p class="text-slate-400 text-sm mt-1">Tablero operativo en vivo</p>
    </div>

    <form method="post" class="bg-slate-900/70 backdrop-blur border border-slate-800 rounded-2xl p-7 shadow-2xl space-y-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, m in messages %}
        <div class="text-sm rounded-lg px-3 py-2 {% if cat=='error' %}bg-red-500/10 border border-red-500/40 text-red-200{% elif cat=='ok' %}bg-emerald-500/10 border border-emerald-500/40 text-emerald-200{% else %}bg-orion-500/10 border border-orion-500/40 text-orion-100{% endif %}">{{ m }}</div>
        {% endfor %}
      {% endwith %}

      <div>
        <label class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Correo o usuario</label>
        <input type="text" name="username" value="{{ username or '' }}" required autofocus
          autocomplete="username"
          class="mt-1 w-full bg-slate-800/70 border border-slate-700 rounded-lg px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orion-500" />
      </div>
      <div>
        <label class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Contraseña</label>
        <input type="password" name="password" required
          class="mt-1 w-full bg-slate-800/70 border border-slate-700 rounded-lg px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orion-500" />
      </div>
      <button type="submit"
        class="w-full py-2.5 bg-gradient-to-r from-orion-500 to-orion-700 hover:from-orion-400 hover:to-orion-600 transition rounded-lg font-semibold text-white shadow-lg shadow-orion-700/40">
        Ingresar
      </button>
    </form>
  </div>
</div>
{% endblock %}
