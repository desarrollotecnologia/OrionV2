{% extends "base.html" %}
{% block title %}Iniciar sesion · BeefData{% endblock %}
{% block fullbody %}
<div class="min-h-screen w-full flex items-center justify-center relative overflow-hidden bg-[#f4f7f4]">
  <div class="absolute inset-0 bg-gradient-to-br from-white via-green-50 to-red-50"></div>
  <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-beef-600 via-white to-orion-600"></div>
  <div class="absolute -top-32 -left-32 w-[600px] h-[600px] rounded-full bg-orion-500/10 blur-3xl"></div>
  <div class="absolute bottom-0 right-0 w-[500px] h-[500px] rounded-full bg-beef-500/10 blur-3xl"></div>

  <div class="relative z-10 w-full max-w-md mx-4">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-beef-600 to-orion-700 grid place-items-center shadow-xl shadow-green-900/20 mb-4 border-2 border-white">
        <span class="text-white font-extrabold text-lg">BD</span>
      </div>
      <h1 class="text-3xl font-bold text-green-900">BeefData</h1>
      <p class="text-slate-600 text-sm mt-1">Colbeef · Tablero operativo en vivo</p>
    </div>

    <form method="post" class="bg-white border border-green-200 rounded-2xl p-7 shadow-xl shadow-green-900/5 space-y-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, m in messages %}
        <div class="text-sm rounded-lg px-3 py-2 {% if cat=='error' %}bg-red-50 border border-red-200 text-red-800{% elif cat=='ok' %}bg-green-50 border border-green-200 text-green-800{% else %}bg-green-50 border border-green-200 text-green-900{% endif %}">{{ m }}</div>
        {% endfor %}
      {% endwith %}

      <div>
        <label class="text-xs uppercase tracking-wide text-green-800 font-semibold">Correo o usuario</label>
        <input type="text" name="username" value="{{ username or '' }}" required autofocus
          autocomplete="username"
          class="mt-1 w-full bg-white border border-green-200 rounded-lg px-3 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orion-500 focus:border-orion-500" />
      </div>
      <div>
        <label class="text-xs uppercase tracking-wide text-green-800 font-semibold">Contraseña</label>
        <input type="password" name="password" required
          class="mt-1 w-full bg-white border border-green-200 rounded-lg px-3 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orion-500 focus:border-orion-500" />
      </div>
      <button type="submit"
        class="w-full py-2.5 bg-gradient-to-r from-beef-600 to-orion-700 hover:from-beef-700 hover:to-orion-800 transition rounded-lg font-semibold text-white shadow-lg shadow-green-900/15">
        Ingresar
      </button>
    </form>
  </div>
</div>
{% endblock %}
