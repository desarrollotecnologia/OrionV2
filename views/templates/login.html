{% extends "base.html" %}
{% block title %}Iniciar sesion · Cut Beef{% endblock %}
{% block fullbody %}
<div class="min-h-screen w-full flex items-center justify-center bg-[#f7f8f6] px-4">
  <a href="http://192.168.20.205:8000/site.html" title="Ir al inicio"
     class="fixed top-5 left-5 w-10 h-10 grid place-items-center rounded-lg bg-white border border-[#dfe5e1] text-[#4a6f56] shadow-sm hover:bg-orion-50 hover:text-orion-700 transition-colors">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
      <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9.5 21v-6h5v6" />
    </svg>
  </a>
  <div class="w-full max-w-md">
    <div class="text-center mb-7">
      <div class="w-14 h-14 mx-auto rounded-xl bg-orion-600 grid place-items-center shadow-sm mb-4">
        <span class="text-white font-semibold text-sm tracking-wide">CB</span>
      </div>
      <h1 class="text-2xl font-semibold text-[#2f3a35] tracking-tight">Cut Beef</h1>
      <p class="text-[#8a9690] text-sm mt-1.5">Colbeef · Tablero operativo</p>
    </div>

    <form method="post" class="bg-white border border-[#dfe5e1] rounded-xl p-6 shadow-sm space-y-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, m in messages %}
        <div class="text-sm rounded-lg px-3 py-2.5 {% if cat=='error' %}bg-[#f3ecee] border border-[#e0cfd1] text-[#653a44]{% elif cat=='ok' %}bg-[#e8efe9] border border-[#d1ddd3] text-[#3d5c48]{% else %}bg-[#f3f6f4] border border-[#dfe5e1] text-[#5c6b63]{% endif %}">{{ m }}</div>
        {% endfor %}
      {% endwith %}

      <div>
        <label class="lbl">Correo o usuario</label>
        <input type="text" name="username" value="{{ username or '' }}" required autofocus
          autocomplete="username" class="inp" placeholder="usuario@colbeef.com" />
      </div>
      <div>
        <label class="lbl">Contraseña</label>
        <input type="password" name="password" required class="inp" placeholder="••••••••" />
      </div>
      <button type="submit" class="w-full py-2.5 mt-1">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
