  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: #14532d;
      background: linear-gradient(160deg, #ffffff 0%, #f0fdf4 45%, #fef2f2 100%);

      place-items: center;
      padding: 2rem;

    .panel { text-align: center; max-width: 520px; }
    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 1rem;

      background: linear-gradient(135deg, #c41e3a, #15803d);
      display: grid; place-items: center;

    p { color: #64748b; margin: 0; line-height: 1.6; }
    .workbeef {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.75rem 1.1rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #c41e3a, #15803d);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 12px 32px -8px rgba(196,30,58,0.35);
      border: 2px solid #fff;
      transition: transform .15s, filter .15s;
      z-index: 50;
    }
    .workbeef:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .workbeef svg { width: 1.15rem; height: 1.15rem; flex-shrink: 0; }
